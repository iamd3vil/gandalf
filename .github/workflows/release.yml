name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install stuffbin
        # goreleaser's post hook invokes stuffbin to embed ./templates into
        # each cross-compiled binary. Pinned to v1.1.0 to match the library
        # version imported by the generator (see go.mod).
        run: go install github.com/knadh/stuffbin/stuffbin@v1.1.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
