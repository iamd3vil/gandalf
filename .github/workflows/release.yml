name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install stuffbin
        # goreleaser's post hook invokes stuffbin to embed ./templates into
        # each cross-compiled binary. Version matches the library in go.mod.
        run: go install github.com/knadh/stuffbin/stuffbin@v1.3.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # Pin to a specific release for reproducible builds; bump manually.
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
