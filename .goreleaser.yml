env:
  - CGO_ENABLED=0
builds:
  - binary: gandalf
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    dir: cmd/generator
    ldflags:
      - -s -w -X "main.buildVersion={{ .Tag }} ({{ .ShortCommit }} {{ .Date }})"
    hooks:
      # stuff each freshly-built binary with static templates.
      # {{ .Path }} resolves to the absolute path of the binary goreleaser
      # just built for the current target (robust to its variant-suffixed
      # output dirs, e.g. gandalf_linux_arm64_v8.0/).
      post: stuffbin -a stuff -in {{ .Path }} -out {{ .Path }} ./templates:/templates

archives:
  - format: tar.gz
    files:
      - README.md
      - LICENSE
